<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>probe 180</title>
<link rel="stylesheet" href="../../app/styles.css">
</head>
<body>
  <main id="app" class="app"></main>
  <nav class="tabbar">
    <button class="tab on" data-view="today"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20H4z"/></svg>今天</button>
    <button class="tab" data-view="data"><svg viewBox="0 0 24 24"><path d="M4 6h16v13H4zM8 3v4M16 3v4M4 10h16"/></svg>数据</button>
    <button class="tab" data-view="body"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>身体</button>
  </nav>
  <div id="modal-root"></div>

  <script src="../../app/store.js"></script>
  <script src="../../app/ui.js"></script>
  <script src="data180.js"></script>
  <script>
  (function () {
    var mode = location.hash.replace('#', '') || 'today';
    var S = window.Store;
    var seed = S.normalize(window.SEED);
    for (var i = 0; i < 3; i++) {
      var kk = S.addDays(S.todayKey(), -i);
      if (seed.days[kk]) seed.days[kk].health = { active: 430 - i * 20, resting: 1490, steps: 8400 - i * 300, workoutMin: 35 };
    }
    window.ZGHDBug.setState(seed);

    if (mode === 'meal') { window.ZGHDBug.go('today', S.todayKey()); document.querySelector('[data-act="meal"][data-meal="lunch"]').click(); }
    else if (mode === 'workout') { window.ZGHDBug.go('today', S.todayKey()); document.querySelector('[data-act="workout"]').click(); }
    else if (mode === 'data') { window.ZGHDBug.go('data', S.todayKey()); }
    else if (mode === 'body') { window.ZGHDBug.go('body', S.todayKey()); }
    else if (mode === 'week' || mode === 'month') {
      window.ZGHDBug.go('today', S.todayKey());
      var btn = document.querySelector('[data-act="range"][data-range="' + mode + '"]');
      if (btn) btn.click();
    } else {
      window.ZGHDBug.go('today', S.todayKey());
    }
  })();
  </script>
</body>
</html>
