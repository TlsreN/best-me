<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>probe v2</title>
<link rel="stylesheet" href="../../app/styles.css">
</head>
<body>
  <main id="app" class="app"></main>
  <nav class="tabbar">
    <button class="tab on" data-view="today"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20H4z"/></svg>今天</button>
    <button class="tab" data-view="data"><svg viewBox="0 0 24 24"><path d="M4 6h16v13H4zM8 3v4M16 3v4M4 10h16"/></svg>数据</button>
    <button class="tab" data-view="body"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>身体</button>
  </nav>
  <div id="modal-root"></div>

  <script src="../../app/store.js"></script>
  <script src="../../app/ui.js"></script>
  <script>
  (function () {
    var S = window.Store;
    var mode = location.hash.replace('#', '') || 'today';
    var base = S.todayKey();
    var s = S.emptyState();

    s.foods = [
      { id: 'f1', name: '鸡胸肉', mode: 'per100g', servingName: null, carbs: 0, protein: 23, fat: 1.5, kcal: 118, lastUsedAt: Date.now() },
      { id: 'f2', name: '一碗米饭', mode: 'perServing', servingName: '碗', carbs: 60, protein: 5, fat: 1, kcal: 300, lastUsedAt: Date.now() - 1000 },
      { id: 'f3', name: '全脂牛奶', mode: 'per100g', servingName: null, carbs: 4.8, protein: 3.3, fat: 3.6, kcal: 65, lastUsedAt: Date.now() - 5000 }
    ];

    for (var i = 12; i >= 0; i--) {
      var k = S.addDays(base, -i);
      var d = S.newDay();
      d.train = i % 2 === 0;
      d.weightKg = Math.round((63 + (12 - i) * 0.05 + (i % 3 === 0 ? -0.15 : 0)) * 10) / 10;
      d.waterMl = i % 3 === 0 ? 1500 : 2000;
      d.foods = [
        { id: 'a' + i, meal: 'breakfast', name: '鸡蛋+牛奶', mode: 'manual', carbs: 12, protein: 20, fat: 14, kcal: 260, micros: { '钠': 180 } },
        { id: 'b' + i, meal: 'lunch', name: '米饭', mode: 'perServing', servings: 1.2, carbs: 72, protein: 6, fat: 1, kcal: 360, micros: {} },
        { id: 'c' + i, meal: 'lunch', name: '鸡胸肉', mode: 'per100g', amountG: 150, carbs: 0, protein: 34.5, fat: 2.3, kcal: 177, micros: {} },
        { id: 'd' + i, meal: 'dinner', name: '牛肉炒菜', mode: 'manual', carbs: 20, protein: 28, fat: 18, kcal: 360, micros: {} }
      ];
      if (d.train) {
        d.workouts = [{ id: 'w' + i, name: '力量训练', kcal: 175, overridden: false,
          sets: [{ exercise: '杠铃深蹲', sets: 4, reps: 8, weight: 60 }, { exercise: '器械腿屈伸', sets: 3, reps: 12, weight: 40 }] }];
        d.cardios = [{ id: 'c' + i, act: 'walk', name: '平地走', minutes: 40, kcal: 160, overridden: false }];
      }
      s.days[k] = d;
    }

    window.ZGHDBug.setState(s);
    if (mode === 'data') window.ZGHDBug.go('data', base);
    else if (mode === 'body') window.ZGHDBug.go('body', base);
    else if (mode === 'meal') { window.ZGHDBug.go('today', base); document.querySelector('[data-act="meal"]').click(); }
    else if (mode === 'workout') { window.ZGHDBug.go('today', base); document.querySelector('[data-act="workout"]').click(); }
    else if (mode === 'food') { window.ZGHDBug.go('data', base); document.querySelector('[data-act="add-food"]').click(); }
    else window.ZGHDBug.go('today', base);
    if (mode === 'diag') {
      var ap = document.querySelector('.app');
      var d = document.createElement('pre');
      d.id = 'diag';
      d.style.cssText = 'position:fixed;left:0;bottom:0;background:#000;color:#0f0;font-size:10px;z-index:999;padding:4px;margin:0';
      d.textContent = 'vw=' + window.innerWidth + ' docW=' + document.documentElement.scrollWidth +
        ' appScroll=' + ap.scrollHeight + ' appClient=' + ap.clientHeight;
      document.body.appendChild(d);
    }
  })();
  </script>
</body>
</html>
